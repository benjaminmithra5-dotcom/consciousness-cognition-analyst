name: Build and Deploy to Vercel

# Runs automatically every time you push to the main branch. This exists
# because Vercel's own build environment cannot run a real headless
# browser (needed for prerendering every page into static HTML), but a
# GitHub Actions runner is a full virtual machine that can. So the actual
# building happens here, and the finished, already-built result is then
# uploaded to Vercel as-is.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build the project (this runs npm run build, including prerendering)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy the already-built result to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
